name: via-worker

services:
  worker:
    image: ${VIA_IMAGE:?VIA_IMAGE is required}
    command: ["via-worker", "run"]
    environment:
      VIA_WORKER_DATABASE_URL: ${VIA_WORKER_DATABASE_URL:?VIA_WORKER_DATABASE_URL is required}
      VIA_WORKER_DATABASE_POOL_SIZE: ${VIA_WORKER_DATABASE_POOL_SIZE:-2}
      VIA_WORKER_DATABASE_MAX_OVERFLOW: ${VIA_WORKER_DATABASE_MAX_OVERFLOW:-0}
      VIA_WORKER_DATABASE_POOL_TIMEOUT_SECONDS: ${VIA_WORKER_DATABASE_POOL_TIMEOUT_SECONDS:-30}
      VIA_WORKER_DATABASE_POOL_RECYCLE_SECONDS: ${VIA_WORKER_DATABASE_POOL_RECYCLE_SECONDS:-300}
      VIA_WORKER_BATCH_SIZE: ${VIA_WORKER_BATCH_SIZE:-1}
      VIA_WORKER_POLL_INTERVAL_SECONDS: ${VIA_WORKER_POLL_INTERVAL_SECONDS:-5}
      VIA_CROPSUITE_INPUT_BINDINGS: ${VIA_CROPSUITE_INPUT_BINDINGS:-/etc/via/input-bindings.json}
      VIA_CROPSUITE_SOURCE_CONFIG: ${VIA_CROPSUITE_SOURCE_CONFIG:-}
      VIA_CROPSUITE_CATALOG: ${VIA_CROPSUITE_CATALOG:-}
      VIA_CROPSUITE_MAX_WORKERS: ${VIA_CROPSUITE_MAX_WORKERS:-1}
      VIA_SCIENTIFIC_SOURCE_BACKEND: s3
      VIA_SCIENTIFIC_SOURCE_CACHE_DIR: /var/lib/via/source-cache
      VIA_SCIENTIFIC_SOURCE_BUCKET: ${VIA_SCIENTIFIC_SOURCE_BUCKET:?VIA_SCIENTIFIC_SOURCE_BUCKET is required}
      VIA_SCIENTIFIC_SOURCE_ENDPOINT: ${VIA_SCIENTIFIC_SOURCE_ENDPOINT:?VIA_SCIENTIFIC_SOURCE_ENDPOINT is required}
      VIA_SCIENTIFIC_SOURCE_REGION: ${VIA_SCIENTIFIC_SOURCE_REGION:-auto}
      VIA_SCIENTIFIC_SOURCE_ACCESS_KEY_ID: ${VIA_SCIENTIFIC_SOURCE_ACCESS_KEY_ID:?VIA_SCIENTIFIC_SOURCE_ACCESS_KEY_ID is required}
      VIA_SCIENTIFIC_SOURCE_SECRET_ACCESS_KEY: ${VIA_SCIENTIFIC_SOURCE_SECRET_ACCESS_KEY:?VIA_SCIENTIFIC_SOURCE_SECRET_ACCESS_KEY is required}
      VIA_SCIENTIFIC_ARTIFACT_BACKEND: s3
      VIA_SCIENTIFIC_ARTIFACT_BUCKET: ${VIA_SCIENTIFIC_ARTIFACT_BUCKET:?VIA_SCIENTIFIC_ARTIFACT_BUCKET is required}
      VIA_SCIENTIFIC_ARTIFACT_ENDPOINT: ${VIA_SCIENTIFIC_ARTIFACT_ENDPOINT:?VIA_SCIENTIFIC_ARTIFACT_ENDPOINT is required}
      VIA_SCIENTIFIC_ARTIFACT_REGION: ${VIA_SCIENTIFIC_ARTIFACT_REGION:-auto}
      VIA_SCIENTIFIC_ARTIFACT_ACCESS_KEY_ID: ${VIA_SCIENTIFIC_ARTIFACT_ACCESS_KEY_ID:?VIA_SCIENTIFIC_ARTIFACT_ACCESS_KEY_ID is required}
      VIA_SCIENTIFIC_ARTIFACT_SECRET_ACCESS_KEY: ${VIA_SCIENTIFIC_ARTIFACT_SECRET_ACCESS_KEY:?VIA_SCIENTIFIC_ARTIFACT_SECRET_ACCESS_KEY is required}
    volumes:
      - /srv/via/config:/etc/via:ro
      - /srv/via/cache/sources:/var/lib/via/source-cache:rw
      - /srv/via/cache/artifacts:/var/lib/via/artifacts:rw
    tmpfs:
      - /var/lib/via/workspace:mode=1777
    restart: unless-stopped
