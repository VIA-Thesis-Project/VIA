GENERAL_INFO:
  process_climate: False
  process_soil: False
  process_land_sea: False
  process_dem: False

  clip_extent: [-77.8, -11.7, -76.7, -10.5]

  nworkers: 4

  reference_mask_layer_path: '../data/huaura/masks/huaura_mask_005.tif'


CLIMATE:
  input_path: '../data/huaura/raw/nex-gddp-cmip6/'

  output_path: '../data/huaura/processed/climate/'

  periods:
    - [2021,2040]

  ssps:
    - ssp126


SOIL:
  input_path: '../data/huaura/raw/soil_final_gapfilled/'
  output_path: '../data/huaura/processed/soil/'


DEM:
  input_path: '../data/huaura/raw/dem.tif'
  output_path: '../data/huaura/processed/dem.tif'


LANDSEA:
  input_path: '../data/huaura/raw/landsea.tif'
  output_path: '../data/huaura/processed/landsea.tif'