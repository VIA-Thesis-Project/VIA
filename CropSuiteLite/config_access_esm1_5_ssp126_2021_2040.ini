[files]
output_dir = results/huaura_environment_validation/run_mw_8gsjo/simulation
climate_data_dir = ../data/huaura/processed_0041667/climate/access-esm1-5_ssp126_2021_2040
plant_param_dir = plant_params/huaura_maize
fine_dem = ../data/huaura/processed_0041667/dem.tif
land_sea_mask = ../data/huaura/processed_0041667/landsea.tif
texture_classes = data\usda_texture_classification.dat
worldclim_precipitation_data_dir = data\worldclim_prec
worldclim_temperature_data_dir = data\worldclim_temp

[options]
max_workers = 4
no_tiles = y
use_scheduler = y
irrigation = 0
day_interval = 10
precipitation_downscaling_method = 1
temperature_downscaling_method = 1
output_format = geotiff
output_all_startdates = y
output_grow_cycle_as_doy = y
downscaling_window_size = 4
downscaling_use_temperature_gradient = y
downscaling_dryadiabatic_gradient = 0.00976
downscaling_saturation_adiabatic_gradient = 0.007
downscaling_temperature_bias_threshold = 0.0005
downscaling_precipitation_bias_threshold = 0.0001
downscaling_precipitation_per_day_threshold = 0.5
output_all_limiting_factors = y
remove_interim_results = y
output_soil_data = y
multiple_cropping_turnaround_time = 21
remove_downscaled_climate = n
rrpcf_interpolation_method = linear
consider_crop_rotation = n
simulate_calcification = 0
resolution = 4
debug = 1

[extent]
upper_left_x = -77.7035
upper_left_y = -10.6069
lower_right_x = -76.53683333333333
lower_right_y = -11.4819

[climatevariability]
consider_variability = y

[membershipfunctions]
plot_for_each_crop = y

[parameters.base_saturation]
data_directory = ../data/huaura/processed_0041667/soil_cropsuite\bsat
