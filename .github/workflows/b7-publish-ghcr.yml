name: B7 Publish VIA image to GHCR

on:
  workflow_run:
    workflows:
      - B2-B6 Container Gate
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout the exact validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify provider deployment contracts
        working-directory: backend
        run: |
          python -m pip install -e ".[test]"
          pytest tests/test_digitalocean_deployment_contract.py -q
          bash -n ../scripts/deploy_digitalocean.sh ../scripts/backup_postgres.sh

      - name: Resolve GHCR image name
        shell: bash
        run: |
          echo "VIA_GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build exact validated commit
        run: |
          docker build --progress=plain -t "$VIA_GHCR_IMAGE:$RELEASE_SHA" .

      - name: Publish immutable git-SHA tag
        run: |
          docker push "$VIA_GHCR_IMAGE:$RELEASE_SHA"
          docker image inspect "$VIA_GHCR_IMAGE:$RELEASE_SHA" --format='Published {{index .RepoDigests 0}}'
