name: B6.1 Resource Benchmark

on:
  workflow_dispatch:
    inputs:
      fixture_path:
        description: Absolute path to the legitimate scientific benchmark fixture JSON on the runner
        required: true
        type: string
      source_dir:
        description: Absolute path to the legitimate read-only scientific source directory on the runner
        required: true
        type: string
      config_dir:
        description: Optional absolute path to additional legitimate worker configuration copied into /etc/via
        required: false
        type: string
      source_config:
        description: Optional container path below /etc/via for VIA_CROPSUITE_SOURCE_CONFIG
        required: false
        type: string
      catalog:
        description: Optional container path below /etc/via for VIA_CROPSUITE_CATALOG
        required: false
        type: string
      runs:
        description: Sequential representative evaluations
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "3"

jobs:
  benchmark:
    name: Measure one real VIA scientific evaluation
    runs-on: [self-hosted, linux, via-benchmark]
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the same VIA image used by B6
        run: docker build --progress=plain -t via:b6 .

      - name: Run B6.1 resource benchmark
        env:
          VIA_IMAGE: via:b6
          VIA_BENCHMARK_FIXTURE: ${{ inputs.fixture_path }}
          VIA_BENCHMARK_SOURCE_DIR: ${{ inputs.source_dir }}
          VIA_BENCHMARK_CONFIG_DIR: ${{ inputs.config_dir }}
          VIA_BENCHMARK_SOURCE_CONFIG: ${{ inputs.source_config }}
          VIA_BENCHMARK_CATALOG: ${{ inputs.catalog }}
          VIA_BENCHMARK_RUNS: ${{ inputs.runs }}
          VIA_BENCHMARK_RESULT_PATH: benchmark-results.json
        run: bash scripts/benchmark_production_runtime.sh

      - name: Upload measurement JSON
        if: ${{ always() && hashFiles('benchmark-results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: b6-resource-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-results.json
          if-no-files-found: ignore
          retention-days: 14

