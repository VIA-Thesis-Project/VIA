services:
  postgis:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${VIA_POSTGRES_DB}
      POSTGRES_USER: ${VIA_POSTGRES_USER}
      POSTGRES_PASSWORD: ${VIA_POSTGRES_PASSWORD}
    ports:
      - "${VIA_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VIA_POSTGRES_USER} -d ${VIA_POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - via_postgis_data:/var/lib/postgresql/data

volumes:
  via_postgis_data:
