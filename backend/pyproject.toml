[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "via-backend"
version = "0.1.0"
description = "VIA modular-monolith backend foundation"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "geoalchemy2>=0.15,<1",
  "openai>=1.68,<3",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "pypdf>=5,<7",
  "PyYAML>=6,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff",
  "pyright",
  "import-linter",
]

[project.scripts]
via-api = "via_backend.api:main"
via-knowledge = "via_backend.knowledge:main"
via-worker = "via_backend.worker:main"
via-migrate = "via_backend.migrate:main"
via-backend = "via_backend.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"via_backend.resources.knowledge" = ["*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
markers = [
  "integration: requires a PostgreSQL/PostGIS database",
  "scientific: requires the real CropSuiteLite engine and scientific datasets",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
